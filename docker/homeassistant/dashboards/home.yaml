# The "Home" dashboard: one sections view, built around what gets checked
# or done most: is the house secure, how warm is it, the car, and Jax.
#
# NOT loaded by Home Assistant from this file. Dashboards are UI state and
# live in the volume (see the top of config/configuration.yaml), so this is the
# source to paste, kept in git so it can be rebuilt and reviewed:
#   Settings → Dashboards → + Add dashboard → New dashboard from scratch,
#   title "Home", then open it → ✏️ → ⋮ → Raw configuration editor → paste → Save.
# README → "Dashboard" has the rest, including making it the default.
#
# HA strips these comments when you save in the raw editor. That is fine: git
# keeps them, and a later edit made in the UI can be copied back here.
#
# Every entity ID here is confirmed against the running HA (2026-10-13),
# except two calendars noted below.

title: Home
views:
  - title: Home
    path: home
    # Not mdi:home: the built-in Overview already uses it in the sidebar.
    icon: mdi:view-dashboard
    type: sections
    max_columns: 2
    # The glanceable strip across the top: who is home, the weather, indoors.
    badges:
      - type: entity
        entity: person.anthony_brignano
        show_name: false
        show_state: true
        show_icon: true
      - type: entity
        entity: weather.forecast_home
        show_name: false
      # The thermostat's own temperature sensor ("Apartment Temperature").
      - type: entity
        entity: sensor.living_room_thermostat_current_temperature
        name: Inside
        show_name: true
      - type: entity
        entity: sensor.spaceship_battery_level
        name: Tesla
        show_name: true
    # Exactly three sections, one per column, each holding more than one
    # heading. The sections view starts each row of sections below the tallest
    # one in the row above, so five short sections left a screen of empty
    # space under the shorter columns; three columns of similar height fit on
    # one screen.
    sections:
      # First section (left column; first on a phone, where sections stack
      # in order): the thermostat, the calendar and the weather.
      - type: grid
        cards:
          - type: heading
            heading: Climate
            icon: mdi:home-thermometer
          # The Honeywell T6 Pro, paired over HomeKit. Set point and mode on
          # the card itself. No hvac_modes list, so it offers whichever modes
          # the thermostat reports. It also shows the room's temperature.
          - type: tile
            entity: climate.living_room_thermostat_lyric_t6_pro_thermostat
            name: Thermostat
            grid_options:
              columns: full
            features:
              - type: target-temperature
              - type: climate-hvac-modes
          # The iCloud calendars from the CalDAV integration, as a list of
          # this week's events (today first). Reminders is left out: it is a
          # to-do list, not a calendar. calendar.appointments is confirmed;
          # events and work are inferred from the calendar names.
          # calendar.sonarr is Sonarr's airing schedule, through the Remote
          # Calendar integration (README → "Sonarr calendar").
          - type: heading
            heading: Calendar
            icon: mdi:calendar
            tap_action:
              action: navigate
              navigation_path: /calendar
          # An agenda of today and tomorrow, not the calendar card: the card
          # scrolls inside a fixed height, which caught swipes on a phone, and
          # a whole week was too much for the home page. The list comes from
          # sensor.upcoming_events (config/configuration.yaml) and grows to
          # fit. Tap the heading for the full calendar.
          - type: markdown
            content: |-
              {%- set evs = state_attr('sensor.upcoming_events', 'events') or [] %}
              {%- set today = now().date() %}
              {%- set ns = namespace(day='', shown=0) %}
              {%- for e in evs %}
              {%- set allday = 'T' not in e.start %}
              {%- set d = strptime(e.start, '%Y-%m-%d') if allday else as_datetime(e.start) %}
              {%- set offset = (d.date() - today).days %}
              {%- if offset <= 1 %}
              {%- set day = 'Tomorrow' if offset == 1 else 'Today' %}
              {%- set ns.shown = ns.shown + 1 %}
              {%- if day != ns.day %}{% set ns.day = day %}

              **{{ day }}**
              {%- endif %}
              - {{ 'All day' if allday else d.strftime('%-I:%M %p') }} · {{ e.summary }}
              {%- endif %}
              {%- endfor %}
              {%- if ns.shown == 0 %}
              Nothing today or tomorrow.
              {%- endif %}
            grid_options:
              columns: full
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: true
            forecast_type: daily
            grid_options:
              columns: full

      # Second section (right column; below the first on a phone): the car,
      # Jax and where everyone is.
      - type: grid
        cards:
          # No Security heading: Home Assistant cannot control the Blink
          # Mini. Its motion detection switch shows on/off but does not
          # change the camera, so the camera is armed and disarmed in the
          # Blink app (2026-10-13).
          # Tesla Fleet, car named "Spaceship" (README → "Asking Alexa
          # questions"). Values are the car's last report; Tesla Fleet does
          # not wake it to read them.
          - type: heading
            heading: Tesla
            icon: mdi:car-electric
          - type: tile
            entity: sensor.spaceship_battery_level
            name: Battery
          - type: tile
            entity: sensor.spaceship_battery_range
            name: Range
          - type: tile
            entity: sensor.spaceship_charging
            name: Charging
          - type: tile
            entity: lock.spaceship_lock
            name: Doors
          # A plain tile, no mode buttons: the car reports a single mode
          # besides off, so the buttons were one full-width power bar. Tapping
          # the icon turns climate on or off; tapping the tile opens the
          # temperature control.
          - type: tile
            entity: climate.spaceship_climate
            name: Climate
            icon_tap_action:
              action: perform-action
              perform_action: climate.toggle
              target:
                entity_id: climate.spaceship_climate
          - type: tile
            entity: switch.spaceship_sentry_mode
            name: Sentry
          # The litter box's last good readings (template sensors in
          # config/configuration.yaml). They read unknown until the box
          # reports once after they were created.
          - type: heading
            heading: Jax
            icon: mdi:cat
          - type: tile
            entity: sensor.jax_last_litter_visit
            name: Last visit
          - type: tile
            entity: sensor.jax_litter_visits_today
            name: Visits today
          - type: tile
            entity: sensor.jax_weight
            name: Weight
          - type: tile
            entity: sensor.jax_last_litter_visit_duration
            name: Visit length
          # Where things are, as tiles rather than a map card: on a phone the
          # map took the swipe meant for scrolling the page. Tapping a tile
          # opens its map; the sidebar's Map shows both together.
          - type: heading
            heading: Where
            icon: mdi:map-marker-radius
          - type: tile
            entity: person.anthony_brignano
            name: Anthony
          # Its icon (mdi:car-electric) is set on the entity in
          # Settings → Entities.
          - type: tile
            entity: device_tracker.spaceship_location
            name: Tesla
