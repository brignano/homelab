# The "Home" dashboard: one sections view, built around what gets checked
# or done most: is the house secure, how warm is it, the car, and Jax.
#
# NOT loaded by Home Assistant from this file. Dashboards are UI state and
# live in the volume (see the top of config/configuration.yaml), so this is the
# source to paste, kept in git so it can be rebuilt and reviewed:
#   Settings → Dashboards → + Add dashboard → New dashboard from scratch,
#   title "Home", then open it → ✏️ → ⋮ → Raw configuration editor → paste → Save.
# README → "Dashboard" has the rest, including making it the default.
#
# HA strips these comments when you save in the raw editor. That is fine: git
# keeps them, and a later edit made in the UI can be copied back here.
#
# Entity IDs marked `# check` are inferred, not read from the running HA. The
# Blink and inside-temperature cards are hidden while their entity does not
# exist (a missing entity reads as unavailable), so a wrong guess leaves a gap
# rather than a yellow "Entity not found" card. To fix one, set its entity
# (and the matching `visibility` entity) to the real ID.

title: Home
views:
  - title: Home
    path: home
    # Not mdi:home: the built-in Overview already uses it in the sidebar.
    icon: mdi:view-dashboard
    type: sections
    max_columns: 2
    # The glanceable strip across the top: who is home, the weather, indoors.
    badges:
      - type: entity
        entity: person.anthony_brignano  # check
        show_name: false
        show_state: true
        show_icon: true
      - type: entity
        entity: weather.forecast_home
        show_name: false
      - type: entity
        entity: sensor.apartment_temperature  # check
        name: Inside
        show_name: true
        visibility:
          - condition: state
            entity: sensor.apartment_temperature
            state_not: unavailable
      - type: entity
        entity: sensor.spaceship_battery_level
        name: Tesla
        show_name: true
    # Exactly three sections, one per column, each holding more than one
    # heading. The sections view starts each row of sections below the tallest
    # one in the row above, so five short sections left a screen of empty
    # space under the shorter columns; three columns of similar height fit on
    # one screen.
    sections:
      # Left column: the house, the car and Jax. Security first: the presence
      # automations arm and disarm Blink on their own, and these buttons are
      # the override.
      - type: grid
        cards:
          - type: heading
            heading: Security
            icon: mdi:shield-home
          - type: tile
            entity: alarm_control_panel.blink_home  # check: Blink names it after the sync module
            name: Blink cameras
            grid_options:
              columns: full
            features:
              - type: alarm-modes
                modes:
                  - armed_away
                  - disarmed
            visibility:
              - condition: state
                entity: alarm_control_panel.blink_home
                state_not: unavailable
          - type: tile
            entity: automation.blink_arm_when_everyone_leaves
            name: Auto-arm when away
            grid_options:
              columns: full
          # Tesla Fleet, car named "Spaceship" (README → "Asking Alexa
          # questions"). Values are the car's last report; Tesla Fleet does
          # not wake it to read them.
          - type: heading
            heading: Tesla
            icon: mdi:car-electric
          - type: tile
            entity: sensor.spaceship_battery_level
            name: Battery
          - type: tile
            entity: sensor.spaceship_battery_range
            name: Range
          - type: tile
            entity: sensor.spaceship_charging
            name: Charging
          - type: tile
            entity: lock.spaceship_lock  # check
            name: Doors
          # A plain tile, no mode buttons: the car reports a single mode
          # besides off, so the buttons were one full-width power bar. Tapping
          # the icon turns climate on or off; tapping the tile opens the
          # temperature control.
          - type: tile
            entity: climate.spaceship_climate
            name: Climate
            icon_tap_action:
              action: perform-action
              perform_action: climate.toggle
              target:
                entity_id: climate.spaceship_climate
          - type: tile
            entity: switch.spaceship_sentry_mode  # check
            name: Sentry
          # The litter box's last good readings (template sensors in
          # config/configuration.yaml). They read unknown until the box
          # reports once after they were created.
          - type: heading
            heading: Jax
            icon: mdi:cat
          - type: tile
            entity: sensor.jax_last_litter_visit
            name: Last visit
          - type: tile
            entity: sensor.jax_litter_visits_today
            name: Visits today
          - type: tile
            entity: sensor.jax_weight
            name: Weight
          - type: tile
            entity: sensor.jax_last_litter_visit_duration
            name: Visit length

      # Right column: weather and where everyone is.
      - type: grid
        cards:
          - type: heading
            heading: Climate
            icon: mdi:home-thermometer
          - type: tile
            entity: sensor.apartment_temperature  # check
            name: Inside
            visibility:
              - condition: state
                entity: sensor.apartment_temperature
                state_not: unavailable
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: true
            forecast_type: daily
            grid_options:
              columns: full
          # Add once the T6 Pro is paired over HomeKit (tsd-personal-assistant.md):
          # - type: tile
          #   entity: climate.thermostat  # check
          #   name: Thermostat
          #   features:
          #     - type: target-temperature
          - type: heading
            heading: Map
            icon: mdi:map-marker-radius
          - type: map
            entities:
              - person.anthony_brignano  # check
              - device_tracker.spaceship_location  # check
            default_zoom: 13
            hours_to_show: 0
            grid_options:
              columns: full
              rows: 4
