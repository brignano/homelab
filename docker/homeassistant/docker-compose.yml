services:
  # Home Assistant — the hub for everything physical in the house: doors, locks,
  # sensors, cameras, presence, and later the car. One integration here instead
  # of a separate MCP server per vendor. See docs/design/tsd-personal-assistant.md
  # (phase 2: read-only, into the digest).
  #
  # Host networking (`network_mode: host`), changed from a bridge on 2026-10-10.
  # HomeKit pairing, Matter and local discovery all need mDNS/SSDP multicast on
  # the LAN, which a Docker bridge does not carry. The first device that needed
  # it was the T6 Pro Smart thermostat (HomeKit is its only local integration,
  # and Resideo's cloud API would not issue developer access).
  #
  # What host mode costs, and where it is paid:
  #   - HA listens on :8123 on every interface of CT 100. LAN and tailnet
  #     devices can reach http://10.0.0.201:8123 directly, behind HA's login,
  #     as well as through Caddy. Turn on IP banning in Settings > System >
  #     Network (README > "Exposure").
  #   - It cannot join Docker networks, so nothing reaches it by container name.
  #     Caddy, blackbox-exporter and the assistant reach it as
  #     host.docker.internal:8123, which each of their compose files maps to
  #     the host with `extra_hosts: host-gateway`. Their requests arrive from
  #     their own 172.x bridge addresses, which the reverse-proxy trust
  #     (172.16.0.0/12) already covers.
  #
  #   Caddy     → https://ha.$HOMELAB_DOMAIN       (LAN + tailnet, never the tunnel)
  #   assistant → http://host.docker.internal:8123  (reads states for the digest)
  #
  # On HL_NO_AUTOPULL (scripts/repo-sync.sh): HA ships breaking changes monthly
  # and migrates its database one way on upgrade, so a version rollback is not
  # a rollback. Same reasoning as `core`. Update it deliberately:
  #   docker compose -f docker/homeassistant/docker-compose.yml pull && ... up -d
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    depends_on:
      homeassistant-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      # HA's own state — .storage (users, auth tokens, integration
      # credentials), the recorder database, logs. A named volume, never a
      # bind mount into the repo: the directory holds secrets, and HA writes to
      # it constantly. NOTE: the lab has no backups yet (AGENTS.md → Planned),
      # so losing this volume means redoing onboarding and every integration.
      - homeassistant_config:/config
      # The one file git owns. Read-only, and a single-file mount, which is the
      # exception AGENTS.md → "Config mounts" allows when the directory holds
      # secrets. The cost is the usual one: after a `git pull` that changes it,
      # the container must be RECREATED (`up -d --force-recreate homeassistant`),
      # not restarted. /deploy and scripts/deploy-plan.sh detect that.
      - ./config/configuration.yaml:/config/configuration.yaml:ro
    network_mode: host

  # One-shot: create the files configuration.yaml includes, and the Blink
  # staging directory, if they are missing.
  #
  # HA's UI editors write automations.yaml, scripts.yaml and scenes.yaml, so git
  # must not track them (a UI edit would dirty the tree, and repo-sync's pull
  # would stop). But HA refuses to load an `!include` whose target does not
  # exist, and on a fresh volume none of them do. This touches only what is
  # absent, so it never overwrites anything you built in the UI.
  #
  # Deliberately no `container_name`: heartbeat.sh's container inventory counts
  # every container_name as "must be running", and this one is supposed to exit.
  homeassistant-init:
    image: busybox:1.36
    restart: "no"
    command:
      - sh
      - -c
      # The same contents HA writes for a fresh install: an empty list for
      # automations, empty files for the other two.
      - |
        [ -e /config/automations.yaml ] || { echo '[]' > /config/automations.yaml; echo created automations.yaml; }
        for f in scripts scenes; do [ -e "/config/$$f.yaml" ] || { : > "/config/$$f.yaml"; echo "created $$f.yaml"; }; done
        # Where the Blink automation saves clips (configuration.yaml), for
        # scripts/blink-clips.sh to move into Jellyfin's library.
        [ -d /config/blink ] || { mkdir /config/blink; echo created blink/; }
    volumes:
      - homeassistant_config:/config
    network_mode: none

volumes:
  homeassistant_config:
