services:
  # The act lane: Claude Agent SDK; reads freely, writes only after a ✅ in
  # Discord (phase 4). See
  # docs/design/tsd-personal-assistant.md and README.md here.
  #
  # No `ports:` and no Caddy route. The assistant bot is the only front door: it
  # takes a message in #ask, POSTs it here over the assistant_concierge network,
  # and renders the answer and any approval prompts. This container has no
  # Discord connection of its own. Outbound only: api.anthropic.com, Google,
  # Home Assistant and Prometheus on the host, Radarr/Sonarr and Jellyfin over
  # proxy_proxy, and TMDB.
  concierge:
    build: .
    image: homelab-concierge:latest
    # heartbeat.sh reads container_name from every compose file and reports it
    # as homelab_container_running, setup-gated (SETUP_GATED_STACKS): required,
    # and alerting when down, once docker/concierge/.env exists on the box.
    container_name: concierge
    restart: unless-stopped
    environment:
      # Workspace-scoped key from the `homelab` workspace in the Claude Console,
      # which has its own monthly spend limit under the org cap. This repo is
      # public: the key lives only in docker/concierge/.env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
      # Shared with docker/assistant/.env. Without a matching token the bot is
      # refused, and so is anything else that ever lands on this network.
      CONCIERGE_TOKEN: ${CONCIERGE_TOKEN:?required}

      CONCIERGE_MODEL: ${CONCIERGE_MODEL:-claude-opus-5-5}
      # Per-request ceilings. The workspace limit is the monthly backstop; these
      # stop one runaway question from spending a meaningful part of it.
      CONCIERGE_MAX_TURNS: ${CONCIERGE_MAX_TURNS:-12}
      CONCIERGE_MAX_BUDGET_USD: ${CONCIERGE_MAX_BUDGET_USD:-0.50}
      # The morning brief (/v1/brief), which the bot runs daily when its
      # BRIEF_ENABLED=true: lower caps, since nobody asked for this spend.
      CONCIERGE_BRIEF_MAX_TURNS: ${CONCIERGE_BRIEF_MAX_TURNS:-8}
      CONCIERGE_BRIEF_MAX_BUDGET_USD: ${CONCIERGE_BRIEF_MAX_BUDGET_USD:-0.20}
      # The evening review (/v1/review), when the bot's REVIEW_ENABLED=true:
      # no lookups, only memory and follow-up proposals, so lower still.
      CONCIERGE_REVIEW_MAX_TURNS: ${CONCIERGE_REVIEW_MAX_TURNS:-6}
      CONCIERGE_REVIEW_MAX_BUDGET_USD: ${CONCIERGE_REVIEW_MAX_BUDGET_USD:-0.15}
      # The brief and the review run on a timer and only read and summarize,
      # so a cheaper model than #ask (CONCIERGE_MODEL). claude-sonnet-5-5 if
      # Haiku misses mail that needed you.
      CONCIERGE_SCHEDULED_MODEL: ${CONCIERGE_SCHEDULED_MODEL:-claude-haiku-5-5}
      CONCIERGE_TIMEOUT_S: ${CONCIERGE_TIMEOUT_S:-300}
      CONCIERGE_MAX_QUEUE: ${CONCIERGE_MAX_QUEUE:-3}
      CONCIERGE_MAX_PROPOSALS: ${CONCIERGE_MAX_PROPOSALS:-3}

      # Optional, and NOT `:?required`, for the same reason as the assistant's
      # digest channel: `--google-auth` is the command that produces the refresh
      # token, and Compose would refuse to run it if the token were required.
      # config.py refuses a half-set Google config at startup. Blank = the
      # calendar and mail tools are not registered at all.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_IDS: ${GOOGLE_CALENDAR_IDS:-primary}

      # Optional: the `concierge` HA user's token. Blank = no home_overview tool.
      # Reads HA's MCP server, which only reports entities exposed to Assist —
      # locks, alarm and garage are never exposed. See app/home.py.
      HA_URL: ${HA_URL:-http://host.docker.internal:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      # Scenes run_scene may propose (scene.* IDs). Blank = no run_scene tool.
      HA_SCENES: ${HA_SCENES:-}
      # The one weather entity weather_forecast reads, through HA's REST API
      # (weather.get_forecasts, which returns data and changes nothing). Needs
      # HA_TOKEN. Blank = off. See app/forecast.py.
      HA_WEATHER_ENTITY: ${HA_WEATHER_ENTITY-weather.forecast_home}
      HA_CALENDARS: ${HA_CALENDARS:-}

      # homelab_status reads fixed instant queries from Prometheus through the
      # port it publishes on the host. Blank = off. See app/homelab.py.
      PROMETHEUS_URL: ${PROMETHEUS_URL-http://host.docker.internal:9090}

      # Optional: github_status reads open PRs, failing workflows and Dependabot
      # alerts on GITHUB_REPOS (owner/name list, or * for every repository the
      # token can see), GET only. A fine-grained token, read-only. Blank token
      # = off. See app/github.py.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOS: ${GITHUB_REPOS:-}

      # Optional: Radarr / Sonarr API keys (each app → Settings → General).
      # Blank = no movie or show tools. Reached by name over proxy_proxy.
      # Every add is a proposal approved in #ask with the exact title, id,
      # quality profile and folder; nothing here can delete. See README.md →
      # "Movies and shows".
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      MEDIA_QUALITY_PROFILE: ${MEDIA_QUALITY_PROFILE:-HD-1080p}
      # Root folders as Radarr/Sonarr see them. Blank = the downloads stack's
      # /data/library/movies and /data/library/shows (config.py).
      RADARR_ROOT: ${RADARR_ROOT:-}
      SONARR_ROOT: ${SONARR_ROOT:-}

      # Optional: movie night (movie_night tool, read-only). See README.md →
      # "Movie night". TMDB: themoviedb.org → Settings → API → "API Read Access
      # Token" (the long one). Jellyfin: Dashboard → API Keys, reached by name
      # over proxy_proxy. Either alone works; neither = no movie_night tool.
      TMDB_TOKEN: ${TMDB_TOKEN:-}
      # The watchlist: a TMDB list's number (or its whole address). Blank = none.
      TMDB_LIST_ID: ${TMDB_LIST_ID:-}
      WATCH_REGION: ${WATCH_REGION:-US}
      # The services you pay for, as TMDB/JustWatch name them, comma-separated,
      # e.g. "Netflix,Hulu,Max,Disney Plus,Amazon Prime Video". `--selftest`
      # names any it can't match.
      STREAMING_SERVICES: ${STREAMING_SERVICES:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      # Whose watch history counts as "already seen". Blank = the only user.
      JELLYFIN_USER: ${JELLYFIN_USER:-}
      # The address you open Jellyfin at, for a tap-to-play link under each pick.
      JELLYFIN_PUBLIC_URL: ${JELLYFIN_PUBLIC_URL:-}

      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The bundled Claude Code CLI: no telemetry, error reporting or update
      # checks. Its only network peer should be the API.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    # A ceiling so a misbehaving agent process cannot crowd out Ollama. The
    # TSD asks for `docker stats` to be measured with Ollama loaded; raise this
    # if a real task gets near it.
    mem_limit: 1g
    # Home Assistant runs on host networking: this name resolves to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - assistant
      - proxy

# Created by the assistant stack, which is the front door. Bring that up first:
# Compose will not create an external network.
#
# proxy_proxy is how this reaches Radarr and Sonarr (docker/downloads/), which
# join it rather than a network of their own. It is the proxy stack's, always
# up, so joining it adds no start-order dependency on the downloads stack. It
# also puts this container's port in reach of everything else on proxy_proxy;
# the bearer token on /v1/ask and /v1/execute is what keeps them out.
networks:
  assistant:
    external: true
    name: assistant_concierge
  proxy:
    external: true
    name: proxy_proxy
