global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # LXC / Docker-host node_exporter (runs in the monitoring stack)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: docker-lxc

  # Proxmox host node_exporter (apt-installed on the bare-metal host m5).
  - job_name: node-proxmox
    static_configs:
      - targets: ["10.0.0.200:9100"]
        labels:
          host: proxmox

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Grafana's own internals — NOT the same question as the blackbox probe below.
  #
  # That probe asks `/api/health` whether Grafana is up. This asks Grafana
  # whether it is working, and the two came apart in exactly the way this repo
  # keeps running into: a provisioned alert rule whose query errors does not
  # notify anyone and does not fail a health check. It simply stops evaluating,
  # and the silence is indistinguishable from "nothing is wrong" — which is the
  # entire signal #alerts is built on.
  #
  # Fourteen rules are provisioned here and nothing could see one of them die.
  # `grafana_alerting_rule_evaluation_failures_total` can, and the notification
  # counters cover the other half: Discord is the only delivery path in this
  # lab, so a webhook that starts rejecting sends is found today by noticing you
  # have not been paged in a while.
  #
  # No auth: Grafana serves /metrics unauthenticated by default, and nothing
  # here sets GF_METRICS_BASIC_AUTH_*. Note that :3000 is published to
  # LAN/tailnet, so this endpoint is reachable there — it was already, this
  # scrape does not change the exposure, and it carries counters rather than
  # anything about what the dashboards contain.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # Proxmox VE API metrics via the multi-target pve-exporter (host m5 API).
  #
  # `host` is carried for the same reason the two node jobs carry it: the
  # instance here is a bare address, and an alert that says "10.0.0.200 is DOWN"
  # makes you look the address up before you can act on it. Rules prefer this
  # label over `instance` when writing their summary.
  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
    static_configs:
      - targets:
          - 10.0.0.200
        labels:
          host: proxmox
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Endpoint uptime probing via blackbox-exporter (multi-target).
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://grafana:3000/api/health
          - http://prometheus:9090/-/healthy
          - http://loki:3100/ready
          - http://portainer:9000/
          - http://open-webui:8080/
          - http://ollama:11434/
          # /health, not /, and the path matters: a bare / carries the Host
          # header `caddy`, which matches no site block and gets a 404 — a
          # failed probe against a healthy proxy. docker/proxy/Caddyfile
          # serves this one path 200 for exactly this reason.
          - http://caddy/health
      # Jellyfin, in an entry of its own for the `service` label. It answers
      # "Healthy" with a 200 on /health, and blackbox reaches it by name because
      # both join proxy_proxy.
      - targets:
          - http://jellyfin:8096/health
        labels:
          service: jellyfin
      # The downloads stack, one entry each for the `service` label, which must
      # match the container name so hl-probe-down stands down while the stack is
      # not set up (no docker/downloads/.env). gluetun's health server answers
      # 200 only while the tunnel works: that probe failing IS the "VPN is down"
      # alert. qBittorrent is reached through gluetun, whose namespace it shares.
      # The *arr apps answer /ping 200 without a login.
      - targets:
          - http://gluetun:9999/
        labels:
          service: gluetun
      - targets:
          - http://gluetun:8080/
        labels:
          service: qbittorrent
      - targets:
          - http://sonarr:8989/ping
        labels:
          service: sonarr
      - targets:
          - http://radarr:7878/ping
        labels:
          service: radarr
      - targets:
          - http://prowlarr:9696/ping
        labels:
          service: prowlarr
      # Cleanuparr's /health is its liveness check: 200 without a login.
      - targets:
          - http://cleanuparr:11011/health
        labels:
          service: cleanuparr
      # FlareSolverr's /health answers {"status":"ok"} 200 without starting a
      # browser, so the probe costs nothing.
      - targets:
          - http://flaresolverr:8191/health
        labels:
          service: flaresolverr
      # Home Assistant, in an entry of its own for the `service` label. HA runs
      # on host networking, so this goes through the host (extra_hosts on
      # blackbox-exporter), and `instance` alone would read as
      # "host.docker.internal" in the alert. /manifest.json, not /: the root
      # redirects to onboarding or the login page depending on state, and this
      # file is served 200 to anyone before either.
      - targets:
          - http://host.docker.internal:8123/manifest.json
        labels:
          service: home-assistant
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Home Assistant again, this time through Caddy's `ha.` route. The probe above
  # goes around Caddy, so a caddy left on a stale config answered `ha.` with 502
  # while it stayed green. Its own job because the module differs (it sends
  # `Host: ha.caddy`, see blackbox/blackbox.yml), and its own alert rule
  # (hl-ha-route-down) because that rule stands down while HA itself is
  # failing: HA down is one page, not two.
  - job_name: blackbox-ha-caddy
    metrics_path: /probe
    params:
      module: [http_ha_via_caddy]
    static_configs:
      - targets:
          - http://caddy/manifest.json
        labels:
          service: home-assistant via caddy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # brignano.io, the public site, which lives on Vercel and not on this box.
  # Its own job because the module differs (real TLS, out through the house's
  # internet, see blackbox/blackbox.yml) and because it wants its own alert
  # rule (hl-site-down): that rule stands down while the house itself has no
  # internet, which hl-probe-down has no reason to know about. A 7-day weekly
  # check reads GitHub; this is what notices the site is down on a Tuesday.
  - job_name: blackbox-public
    metrics_path: /probe
    params:
      module: [http_2xx_public]
    static_configs:
      - targets:
          - https://brignano.io/
        labels:
          service: brignano.io
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # DNS probing via blackbox-exporter. Separate job rather than another target
  # in `blackbox`, because the module differs per target and `params` is set per
  # job — and because these two want their own alert wording: "the house has no
  # DNS" is not the same page as "an admin UI is 404ing".
  #
  # Targets are DNS *servers*; the name being looked up lives in the module (see
  # blackbox/blackbox.yml). The `probe` label is what tells the two apart on a
  # dashboard, since both share the same instance.
  - job_name: blackbox-dns-home
    metrics_path: /probe
    params:
      module: [dns_home]
    static_configs:
      - targets:
          - adguard:53
        labels:
          probe: home-zone
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-dns-upstream
    metrics_path: /probe
    params:
      module: [dns_upstream]
    static_configs:
      - targets:
          - adguard:53
        labels:
          probe: upstream
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
