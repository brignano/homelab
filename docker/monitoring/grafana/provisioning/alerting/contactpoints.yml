apiVersion: 1

# One contact point, one delivery: Discord #alerts. ntfy used to run alongside
# it for phone push, but Discord is readable everywhere the phone app was, so
# the second path only added a server to maintain — see docs/setup-log.md.
#
# This does not cover the box being *down*: Grafana and the Discord bot both run
# on the machine they watch, so a dead host is silent. That gap is closed from
# outside by scripts/heartbeat.sh, whose Healthchecks.io check alerts the same
# #alerts channel — see docs/design/tsd-alerting-off-box.md.
#
# With ntfy gone this is the only path Grafana has, so DISCORD_ALERT_WEBHOOK is
# `:?required` in docker-compose.yml: the stack refuses to start rather than
# come up alerting into the void.

# Deleting a receiver from this file does NOT delete it from Grafana. File
# provisioning upserts by uid; anything already in Grafana's database that
# simply stops being mentioned is left alone, shown as "Unused", and cannot be
# removed from the UI either (the Delete button is greyed out on provisioned
# resources). So dropping the ntfy receiver in the previous commit was a no-op
# against the running instance: it kept firing at http://ntfy:80, which no
# longer exists. This is the directive that actually removes it.
#
# Safe to keep permanently — a uid that is already gone (or was never there, as
# on a fresh install) deletes as a no-op, so this converges either way. It can
# be dropped once every Grafana instance this repo provisions has restarted at
# least once with it in place.
#
# Deletion is by *receiver* uid, not contact-point name. `homelab` itself must
# survive: policies.yml routes to it by name, and Grafana rejects deleting a
# contact point a route still points at. Removing one of two receivers leaves
# the name in place, backed by discord_webhook.
deleteContactPoints:
  - orgId: 1
    uid: ntfy_webhook

contactPoints:
  - orgId: 1
    name: homelab
    receivers:
      # Discord webhook -> #alerts. A webhook is write-only and needs no bot,
      # which is the point: it still delivers when the assistant bot is down.
      # Set DISCORD_ALERT_WEBHOOK in docker/monitoring/.env.
      - uid: discord_webhook
        type: discord
        settings:
          url: ${DISCORD_ALERT_WEBHOOK}
          use_discord_username: false
          # Without these two, Grafana uses `default.title` / `default.message`
          # — the fifteen-line dump of every label, value and URL.
          #
          # `message` becomes the Discord message content and `title` the embed
          # BELOW it, which is why the heading lives in the message rather than
          # here: a title set here renders under the body, not above it. The
          # embed is left to do the two things it is good at — Grafana colours
          # it red or green, and this title is its one clickable element.
          # templates.yml has the reasoning in full.
          #
          # It used to read `Open in Grafana →`, which promised more than it
          # delivers: Grafana's Discord notifier hardcodes the embed's URL to
          # `/alerting/list` and the contact point cannot override it, so the
          # one clickable thing on an alert has always landed on the list of
          # every alert in the lab. The links that go to the *firing rule* are
          # in the message body now (see templates.yml); this title says where
          # it actually goes, and the list is still worth one click.
          title: 'All alerts in Grafana →'
          message: '{{ template "homelab.message" . }}'
        disableResolveMessage: false
