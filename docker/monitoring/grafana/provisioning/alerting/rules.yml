apiVersion: 1

# Grafana 13.2 exports no notification *delivery* failure counter.
#
# `hl-notifications-failing` was added on the assumption that it did — the
# embedded Alertmanager's other upstream metrics all appear under the
# `grafana_alerting_` prefix (`nflog_*`, `silences_*`, `dispatcher_*`, and
# `notification_latency_seconds`), so the counters looked like a safe bet. They
# are not there: `grafana_alerting_notifications_failed_total` does not exist,
# and neither does the unprefixed `alertmanager_` form. Confirmed against the
# running instance's full 695-metric list, not inferred.
#
# So the rule could never fire. It was not broken in any way Grafana would
# report — it evaluated a query that matched nothing, stayed Normal forever, and
# looked exactly like a delivery path in perfect health. Removing it is the
# honest outcome; the Triage dashboard now shows notification *sends* against
# active alerts instead, where a flat line under a rising one is the same signal
# read off two curves.
#
# Deleting the rule from this file does NOT delete it from Grafana — file
# provisioning upserts by uid, so a rule that simply stops being mentioned is
# left in the database, and the UI will not delete a provisioned resource
# either. This directive is what actually removes it. Safe to keep permanently:
# a uid that is already gone deletes as a no-op, so it converges either way.
deleteRules:
  - orgId: 1
    uid: hl-notifications-failing

groups:
  - orgId: 1
    name: homelab-core
    folder: Homelab Alerts
    interval: 1m
    rules:
      # --- A scrape target / host / exporter is down ---
      - uid: hl-target-down
        title: Target down
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          # `host` where the target carries one (the two node jobs and pve),
          # `instance` otherwise: the scrape addresses for those three are bare
          # IPs, and "10.0.0.200:9100 is DOWN" has to be looked up before it can
          # be acted on. Everything else scrapes a container by name, which
          # already reads as the thing it is.
          summary: "{{ $labels.job }} target {{ if $labels.host }}{{ $labels.host }}{{ else }}{{ $labels.instance }}{{ end }} is DOWN"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- Filesystem usage above 85% ---
      - uid: hl-disk-full
        title: Filesystem above 85%
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} is {{ printf \"%.0f\" $values.A.Value }}% full"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100)
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [85] }

      # --- Available memory below 10% ---
      - uid: hl-mem-low
        title: Available memory below 10%
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} has only {{ printf \"%.0f\" $values.A.Value }}% memory available"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [10] }

      # --- A probed service endpoint is unreachable ---
      #
      # Scoped to the HTTP job. The DNS probes have their own rule below, because
      # "the house has no name resolution" and "an admin UI is 404ing" are not
      # the same page, and both probe the same instance (adguard:53) — which the
      # notification policy groups on, so without the split they would arrive as
      # one indistinguishable message.
      - uid: hl-probe-down
        title: Service endpoint unreachable
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Probe failing for {{ if $labels.service }}{{ $labels.service }} ({{ $labels.instance }}){{ else }}{{ $labels.instance }}{{ end }}"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job="blackbox"}
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- Caddy's route to Home Assistant is broken ---
      #
      # The direct HA probe (service="home-assistant" above) goes around Caddy,
      # so `ha.` answering 502 used to page nobody. This one goes through it.
      #
      # `unless` stands it down while either end is failing on its own: HA
      # (the direct probe) or Caddy (http://caddy/health). Either one fails this
      # probe too, and hl-probe-down already pages for it by name. What is left
      # is the case only this probe can see, both ends up and the route between
      # them broken, so the summary can say what to fix. If either guard's
      # series is missing altogether, `unless` drops nothing and this still
      # fires.
      - uid: hl-ha-route-down
        title: Home Assistant route broken
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is failing while Caddy and Home Assistant both answer on their own: the ha. route is broken (stale caddy config? recreate caddy)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: |
                probe_success{job="blackbox-ha-caddy"}
                  unless on() (probe_success{job="blackbox", service="home-assistant"} == 0)
                  unless on() (probe_success{job="blackbox", instance="http://caddy/health"} == 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- PostgreSQL is down ---
      - uid: hl-postgres-down
        title: PostgreSQL down
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is not responding (pg_up=0)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: pg_up
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- AdGuard is not resolving names ---
      #
      # The most consequential unmonitored thing in the lab until now. AdGuard is
      # the household resolver; when it stops answering, every device loses name
      # resolution and every tool you would reach for to diagnose it resolves
      # through the thing that is down. repo-sync.sh already refuses to
      # auto-restart the proxy stack for exactly this reason — the care taken not
      # to break it was never matched by any way to learn that it had broken.
      #
      # `probe` distinguishes the two failures: `home-zone` is AdGuard itself or
      # its *.home rewrite; `upstream` is AdGuard up but recursion broken. They
      # look identical from a laptop and have different fixes.
      - uid: hl-dns-down
        title: DNS not resolving
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "AdGuard DNS failing the {{ $labels.probe }} check — the LAN may have no name resolution"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job=~"blackbox-dns-.*"}
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- A container that should be running is not ---
      #
      # cAdvisor reports on containers that exist; it has nothing to say about
      # one that should exist and does not. Blackbox covers seven endpoints. This
      # covers every container declared in docker/*/docker-compose.yml, including
      # the ones with no port to probe — the assistant bot in particular had no
      # monitoring of any kind. `required="no"` excludes the containers that are
      # meant to be down (Sablier scales kali-linux to zero; cloudflared has
      # never been deployed).
      - uid: hl-container-missing
        title: Container not running
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container }} ({{ $labels.stack }} stack) is not running"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: homelab_container_running{required="yes"}
              instant: true
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- The daily digest stopped arriving ---
      #
      # The digest pushes, so nobody checks it — which makes a missing one
      # indistinguishable from a quiet morning. discord.py's
      # `tasks.loop(time=...)` has no catch-up, so a bot that was down at
      # DIGEST_AT and back five minutes later skips that day in silence.
      #
      # `hl-container-missing` already covers the container being gone. This is
      # the narrower case: bot up, healthy, gateway connected, schedule not
      # firing. The timestamp is written by the assistant (app/stamp.py) and
      # published by heartbeat.sh, which reads it from the host — so it still
      # answers while the bot is stopped.
      #
      # 25h, not 24: the digest is daily, so anything under a day is normal and
      # an hour of grace absorbs a slow generation or a restart near 07:30.
      # The series is simply absent on a fresh install or with
      # DIGEST_ENABLED=false, and noDataState OK means that is silence, not an
      # alert about a feature nobody turned on.
      - uid: hl-digest-missing
        title: Daily digest has not posted
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Last homelab digest posted {{ printf \"%.0f\" $values.A.Value }}h ago"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (time() - homelab_digest_timestamp_seconds) / 3600
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [25] }

      # --- The digest stopped reading one of its sources ---
      #
      # The digest's "Today" section (docs/design/tsd-personal-assistant.md):
      # Google calendar and mail, and Home Assistant. A failed read does show in
      # the digest as "not read", but that line is read once, on a phone, and
      # the likely causes will not heal by themselves. For Google: the refresh
      # token was revoked, the password changed, or the OAuth app was left in
      # "Testing", where Google expires tokens after 7 days. For Home Assistant:
      # the container is down, or the digest user's token was deleted.
      #
      # The uid says "google" because that was the only source when it was
      # written. It is kept rather than renamed: Grafana does not delete a
      # provisioned rule just because it left this file (that takes a
      # `deleteRules` entry), so a rename risks two near-copies paging twice.
      #
      # The bot arms each enabled source's stamp at startup, so a source that
      # never worked still ages into this alert rather than publishing nothing.
      # 25h for the same reason as hl-digest-missing: sources are read with the
      # daily digest. If the digest itself stops, both fire, and that one is the
      # cause. Absent series (source off, or the schedule off) is silence.
      - uid: hl-google-stale
        title: Digest cannot read one of its sources
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Digest has not read {{ if eq $labels.source \"home\" }}Home Assistant{{ else if eq $labels.source \"ha-calendar\" }}Home Assistant calendars{{ else }}Google {{ $labels.source }}{{ end }} for {{ printf \"%.0f\" $values.A.Value }}h — {{ if eq $labels.source \"home\" }}check the homeassistant container and the digest user's HA_TOKEN{{ else if eq $labels.source \"ha-calendar\" }}check HA_CALENDARS, the CalDAV integration and the digest user's HA_TOKEN{{ else }}rerun the assistant's --google-auth if the sign-in expired{{ end }}"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (time() - homelab_assistant_source_timestamp_seconds) / 3600
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [25] }

      # --- A container is crash-looping ---
      #
      # Restarting four times in fifteen minutes is not a restart, it is a loop.
      # Docker's `restart: unless-stopped` makes this completely silent: the
      # container is always about to be up, so a probe catches it only if it
      # happens to land in a down window, and `docker ps` looks fine.
      - uid: hl-container-restarting
        title: Container restart loop
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} has restarted {{ printf \"%.0f\" $values.A.Value }} times in 15m"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: changes(container_start_time_seconds{name!=""}[15m])
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3] }

      # --- A scheduled job has no crontab entry ---
      #
      # This is the 2026-09-19 failure, stated as an alert. repo-sync.sh had
      # never been installed on CT 100: the tree sat three weeks behind main, a
      # merged change looked deployed because GitHub said so, and a job that only
      # speaks when something is wrong cannot report never having run.
      #
      # noDataState is OK here and in every textfile-backed rule below, which is
      # deliberate rather than an oversight. These series come from
      # scripts/metrics.sh via the node_exporter textfile collector; NoData means
      # the jobs are not publishing at all, which is "the box or cron is dead" —
      # and that is already watched from OFF the box by Healthchecks, where
      # silence is the signal. Alerting on it here too would only duplicate a
      # weaker version of a check that already exists, and would page on every
      # fresh install before install-cron.sh has run.
      # --- A dead man's switch is not arming ---
      #
      # The switches watch the jobs; this watches the switches. On 2026-09-19
      # the pg_dumpall's ping URL turned out to be the placeholder from
      # .env.example — non-empty, so the script's "unset" warning never fired,
      # and pinged with `|| true`, so the 404 went nowhere. A job with no
      # working switch looks exactly like one whose switch has never had cause
      # to fire.
      #
      # `for: 1h` rather than minutes: a daily job publishes this once a day, so
      # a real failure stays 0 until tomorrow and will be caught either way,
      # while the 5-minute heartbeat should be allowed a blip on a flaky uplink
      # without paging.
      - uid: hl-hc-ping-failing
        title: Dead man's switch not arming
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} cannot arm its dead man's switch — the ping is failing or its URL is unset; see /var/log/{{ $labels.job }}.log on CT 100"
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: homelab_healthchecks_ping_success
              instant: true
          - refId: C
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: hl-cron-missing
        title: Scheduled job not installed
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has no crontab entry — run ./scripts/install-cron.sh on CT 100"
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: homelab_cron_job_installed
              instant: true
          - refId: C
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- The repo sync has not run ---
      #
      # 26 hours, against an 04:00 daily schedule: one missed run plus two hours
      # of slack, so a slow run or a clock skew does not page.
      - uid: hl-repo-sync-stale
        title: Repo sync has not run
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "repo-sync last ran {{ printf \"%.0f\" $values.A.Value }}h ago — the box may be running old code"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (time() - homelab_repo_sync_timestamp_seconds) / 3600
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [26] }

      # --- The nightly database dump is stale ---
      #
      # Measured from the last SUCCESSFUL run: pg-backup.sh deliberately does not
      # move its timestamp on failure, so a job that runs and fails every night
      # shows up here as an ageing backup rather than a fresh one.
      #
      # This is the lab's only protection against an accidental DROP, and until
      # now it was the one scheduled job with no dead man's switch at all — which
      # AGENTS.md has forbidden in writing the whole time.
      - uid: hl-backup-stale
        title: PostgreSQL backup is stale
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Last good pg_dumpall was {{ printf \"%.0f\" $values.A.Value }}h ago"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (time() - homelab_pg_backup_timestamp_seconds) / 3600
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [26] }

      # --- Jellyfin lost the GPU ---
      #
      # heartbeat.sh checks every 5 minutes that /dev/dri/renderD128 exists in
      # CT 100 (once docker/jellyfin/.env exists there). Without it, the next
      # Jellyfin restart fails or transcodes on the CPU. Usual causes: a host
      # kernel update, or the dev0 line gone from /etc/pve/lxc/100.conf.
      # docker/jellyfin/README.md §1 has the fix.
      - uid: hl-jellyfin-gpu-missing
        title: Jellyfin GPU missing from CT 100
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The iGPU (/dev/dri/renderD128) is missing from CT 100, so Jellyfin cannot hardware-transcode; check dev0 in /etc/pve/lxc/100.conf"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: homelab_jellyfin_gpu_present
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- The newest Postgres dump did not restore ---
      #
      # pg-backup.sh proves a dump was written; scripts/pg-restore-test.sh
      # restores the newest one into a throwaway server every Sunday and proves
      # it can be read back. This fires when the last test failed: a truncated
      # dump, a statement that errors on replay, or counts that do not match.
      # Whether the test still RUNS is Healthchecks' job
      # (HEALTHCHECKS_PG_RESTORE_TEST_URL), because a test that never runs
      # leaves no metric behind to alert on.
      #
      # Re-run by hand once fixed: ./scripts/pg-restore-test.sh
      - uid: hl-restore-test-failed
        title: PostgreSQL restore test failed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "The newest Postgres dump failed its restore test; {{ if lt $values.B.Value 0.0 }}it has never passed{{ else }}last pass was {{ printf \"%.0f\" $values.B.Value }}d ago{{ end }}"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: homelab_pg_restore_test_success
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              instant: true
              # `or vector(-1)`: the timestamp exists only once a test has passed.
              # Without a value here, a failing FIRST run (right after deploy, the
              # likeliest time) would put the rule in NoData, which is OK, i.e.
              # silent. -1 means "never passed" to the summary.
              expr: (time() - homelab_pg_restore_test_timestamp_seconds) / 86400 or on() vector(-1)
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- A container is serving a config file the repo has replaced ---
      #
      # The six-day bug. A single-file bind mount is pinned to an inode at
      # container create time and git replaces files rather than editing them, so
      # a pull leaves the container reading an unlinked copy — while `git pull`
      # says "Already up to date", `/-/reload` returns 200, and CI is green.
      #
      # Fixed with a RECREATE, never a restart:
      #   docker compose -f docker/<stack>/docker-compose.yml up -d --force-recreate <service>
      #
      # One quirk worth knowing: textfile metrics persist until the job that
      # wrote them runs again, and repo-sync.sh is daily. So this stays firing
      # until the next 04:00 run even once you have fixed it — re-run
      # ./scripts/repo-sync.sh by hand to clear it immediately.
      - uid: hl-config-drift
        title: Container config is stale
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container }} is serving an old copy of {{ $labels.path }} — needs --force-recreate, not restart"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: homelab_config_drift
              instant: true
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # --- A stack has been running old code for two days ---
      #
      # repo-sync.sh restarts stale stacks automatically and reports the ones it
      # will not touch (proxy, because it holds the household's DNS). This is the
      # backstop for when that reporting goes unread: 48h means two nightly runs
      # have failed to resolve it, which is no longer a thing to notice in a
      # Discord scrollback.
      - uid: hl-stack-drift
        title: Stack running old code
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.stack }} is {{ printf \"%.0f\" $values.A.Value }}h behind the repo"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: homelab_stack_deploy_drift_seconds / 3600
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [48] }

      # --- A filesystem will be full within four days ---
      #
      # The 85% rule says a disk IS nearly full. This says one is GOING to be,
      # while there is still time to do something cheap about it. It matters most
      # for CT 100, whose 400 GB rootfs sits on a ~348 GiB thin pool that cannot
      # auto-extend — the guest can believe it has room the pool does not have.
      #
      # predict_linear over 6h is deliberately short-sighted: it catches a real
      # leak (a log loop, a runaway volume) rather than slow organic growth, and
      # it un-fires on its own once the slope flattens.
      - uid: hl-disk-filling
        title: Filesystem filling up
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} is on course to be full within 4 days"
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 4 * 24 * 3600)
          - refId: C
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0] }

      # --- The thin pool under CT 100 is filling ---
      #
      # The two rules above watch the guest's view of its disk, and that view is
      # optimistic by design (AGENTS.md "Disk"). The pool under it is the ceiling
      # that actually exists. On 2026-10-10 the guest read 18% while the pool
      # read 52%, which is the gap neither rule above can see.
      #
      # 80%, not 85%: a full guest filesystem fails writes in one container, but
      # a full thin pool fails them for every volume on it, and the VG has
      # ~16 GiB free, so the pool cannot be grown out of trouble. The first thing
      # to try is `pct fstrim 100` on the host, which is also scheduled weekly.
      #
      # Metric names checked against the running exporter on 2026-10-10, and
      # already in use on the Capacity dashboard. noDataState is OK because an
      # exporter outage already fires hl-target-down. A renamed metric would leave
      # this rule silent; health.sh reports "thin pool usage unknown" in that case.
      - uid: hl-thinpool-full
        title: Thin pool above 80%
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Proxmox thin pool local-lvm is {{ printf \"%.0f\" $values.A.Value }}% full. The guest's own disk numbers will not show this. Run pct fstrim 100 on the host"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # No label_replace: this directory gets environment-variable
              # substitution (contactpoints.yml relies on it), and its "$1"
              # would not reach Prometheus intact.
              expr: >-
                pve_disk_usage_bytes{id=~"storage/.+/local-lvm"}
                / pve_disk_size_bytes{id=~"storage/.+/local-lvm"} * 100
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }

      # --- An alert rule is failing to evaluate ---
      #
      # The watchman's own blind spot, and the sharpest version of the failure
      # class this whole stack keeps meeting. A provisioned rule whose query
      # errors — a renamed metric, a datasource that stopped answering, a typo
      # that survived a restart — does not fire and does not warn. It stops
      # evaluating, and stopping is indistinguishable from having nothing to
      # report. Fourteen rules are provisioned here and until now nothing could
      # have told you one of them had died.
      #
      # This rule is the exception to that, and it cannot cover itself: if the
      # Grafana scrape is what breaks, `up{job="grafana"}` is what says so
      # (hl-target-down), and if Grafana is down entirely, heartbeat.sh reports
      # it from off the box. Each layer is watched by the one outside it.
      - uid: hl-alert-eval-failing
        title: Alert rule failing to evaluate
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "A Grafana alert rule is erroring — it is not firing and not warning. Alerting → Rules, filter state=Error"
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(grafana_alerting_rule_evaluation_failures_total[15m]))
          - refId: C
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
