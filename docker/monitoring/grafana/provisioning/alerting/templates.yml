apiVersion: 1

# What an alert looks like once it reaches #alerts.
#
# Grafana's built-in `default.message` prints, for every alert in the group: the
# value of each query, every label, every annotation, then the Source, Silence,
# Dashboard and Panel URLs — around fifteen lines, most of a screen on a phone,
# to say "/ is 87% full", with the one sentence a human needs buried in the
# middle of it.
#
# Everything worth reading is in the rule's `summary` annotation. rules.yml
# gives every rule one, written as a sentence with the value already in it
# ("docker-lxc / is 87% full", "proxy is 774h behind the repo"), because that is
# the line that decides whether you get up.
#
# Where the pieces land, which is not obvious
# -------------------------------------------
# Grafana's Discord notifier puts `message` in the Discord message CONTENT and
# `title` in an EMBED below it. So the title renders *under* the body, not above
# it, and a message that opened with its details read as starting mid-sentence.
#
# The fix is to stop treating the embed title as a heading: the content carries
# its own heading (emoji + bold rule name), then the alerts, then the timing.
# That order also matches what a phone shows on the lock screen, which previews
# the content rather than the embed.
#
# The embed keeps the two jobs it is actually good at: Grafana colours it red or
# green, and its title is the one clickable element — so it says `Open in
# Grafana →` and nothing else, rather than repeating the heading in blue.
#
# What is deliberately NOT here
# -----------------------------
# The `instance` label. It reads as identity and frequently is not: every alert
# derived from a textfile metric — stack drift, config drift, backup age, cron
# — carries `instance=node-exporter:9100`, because that is merely where the
# metric was scraped from. The subject is in the summary already ("proxy is
# 774h behind"), so the heading names the rule and the lines name the things.
#
# Times are Discord timestamps (`<t:unix:R>` renders as "3 hours ago"), not
# strings formatted here. Discord renders them per-client in the reader's own
# timezone; a time formatted in this template would be UTC, since the Grafana
# container sets no TZ. The relative form is also the one that matters on a
# `repeat_interval: 4h` re-send, where the question is "how long has this been
# broken", not "when did it start".
#
# Two things to know before editing:
#   - Provisioning is read at startup, so changes need `docker compose restart
#     grafana` like the rest of `grafana/provisioning/` — see README.md.
#   - A template that fails to parse takes the notification with it. Verify with
#     Alerting -> Contact points -> homelab -> Test, which exercises both the
#     firing and resolved paths, before trusting it with a real alert.

templates:
  - orgId: 1
    name: homelab
    template: |
      {{/* One alert, as a line. Resolved alerts keep their summary but strike
           it through, so a group where one thing recovered and another did not
           reads correctly line by line. Falls back to the rule name so a future
           rule that forgets its summary annotation degrades to something
           readable rather than an empty message. */}}
      {{ define "homelab.line" -}}
      {{ if eq .Status "resolved" }}~~{{ end }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}{{ if eq .Status "resolved" }}~~{{ end }}
      {{- end }}

      {{/* Heading, blank line, one line per alert, timing. Bulleted only when
           there is more than one — a single bullet is punctuation with nothing
           to separate. Groups of several are normal here despite grouping on
           `instance`, because the textfile-metric rules all share one. */}}
      {{ define "homelab.message" -}}
      {{ if eq .Status "resolved" }}✅{{ else if eq .CommonLabels.severity "critical" }}🔴{{ else }}🟠{{ end }} **{{ .CommonLabels.alertname }}**

      {{ if gt (len .Alerts) 1 -}}
      {{ range .Alerts }}• {{ template "homelab.line" . }}
      {{ end }}
      {{- else -}}
      {{ range .Alerts }}{{ template "homelab.line" . }}
      {{ end }}
      {{- end }}
      {{ if .Alerts }}{{ if eq .Status "firing" }}*started <t:{{ (index .Alerts 0).StartsAt.Unix }}:R>*{{ else }}*resolved <t:{{ (index .Alerts 0).EndsAt.Unix }}:R>*{{ end }}{{ end }}
      {{- end }}
