services:
  # Actual Budget — private envelope budgeting for 2027 (#310). See README.md.
  #
  # Tailnet-only, on purpose, and why that holds:
  #
  #   1. No published ports. Nothing listens on CT 100's interfaces for it.
  #   2. Caddy reaches it over proxy_proxy at budget.$HOMELAB_DOMAIN. That name
  #      resolves to 10.0.0.201, a private address, so only a LAN or tailnet
  #      device can connect. There is no Cloudflare Tunnel route and there must
  #      not be one: this is financial data.
  #   3. Bank sync is off by design. No SimpleFIN or GoCardless secrets exist
  #      here and none are to be added; transactions come in as CSV/OFX/QFX
  #      files imported by hand in the app.
  #
  # The server password is not in this file or in any .env. Actual asks for it
  # on first open and stores a hash in the data volume. Turn on the budget
  # file's end-to-end encryption in the app as well (README).
  actual:
    image: actualbudget/actual-server:26.11.0@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6
    container_name: actual
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - data:/data
    networks:
      - proxy

volumes:
  data:

# Joins proxy_proxy rather than giving Caddy a network to join, like Jellyfin
# and the downloads stack: an external network that does not exist would stop
# the proxy stack, and the household's DNS with it.
networks:
  proxy:
    external: true
    name: proxy_proxy
