services:
  # TV guide for Jellyfin's Live TV: iptv-org/epg's grabber, fetching
  # programme listings for the channels in Jellyfin's M3U playlists and serving
  # them as XMLTV. See README.md.
  #
  #   Jellyfin → http://epg:3000/guide.xml   (over proxy_proxy; no port, no route)
  #
  # The image runs two things under pm2: a static server for public/ on :3000,
  # and the grab on CRON_SCHEDULE. Our start.sh runs first: it rebuilds
  # public/channels.xml from the playlists, so the guide follows the playlist
  # without a list kept by hand, and asks for a grab at startup only when there
  # is no guide yet.
  #
  # public/ is a host directory, not a volume, so heartbeat.sh can read
  # guide.xml's age from the host and hl-epg-stale can say the grab stopped
  # even while this container is down. That timestamp is this job's dead man's
  # switch: the schedule lives inside the container, out of cron's sight.
  #
  # Version: :master, following the lab's default, so the nightly auto-pull
  # brings it current. Here that is a feature: the scrapers break whenever a
  # listings site changes its pages, and fixes land on master.
  epg:
    image: ghcr.io/iptv-org/epg:master
    container_name: epg
    restart: unless-stopped
    # A grab is mostly waiting on HTTP. One core keeps a bad night off Ollama's
    # four. Memory is the real need: before fetching anything, the grabber loads
    # the whole iptv-org database (every channel, feed and stream) into the
    # heap. Node sizes its heap from the container limit, roughly half, and at
    # 1g that is ~510 MB: the first grab died at request 21 of 1,842 with
    # "JavaScript heap out of memory" (2026-10-11). So the heap is set
    # explicitly, with the limit above it for Node's own non-heap memory.
    cpus: 1
    mem_limit: 2g
    command: ["sh", "/hl/start.sh"]
    environment:
      TZ: ${TZ:-UTC}
      EPG_PLAYLISTS: ${EPG_PLAYLISTS:?set EPG_PLAYLISTS in docker/epg/.env (the same M3U URLs as Jellyfin's tuners)}
      # Guide sources known to be dead, left out so their channels fall through
      # to the next site that lists them (bin/make-channels.mjs). i.mjh.nz's
      # Flash feed returned 404 for every request on 2026-10-11.
      EPG_SKIP: ${EPG_SKIP:-i.mjh.nz/Flash/}
      # 01:00 local: clear of the 02:30 vzdump, Jellyfin's 03:30 tasks and the
      # 04:00 repo-sync.
      CRON_SCHEDULE: ${EPG_CRON_SCHEDULE:-0 1 * * *}
      DAYS: ${EPG_DAYS:-3}
      # The grabber's own advice: more connections get you blocked by the
      # listings sites.
      MAX_CONNECTIONS: ${EPG_MAX_CONNECTIONS:-2}
      # Inherited by every node process pm2 starts: the scheduled grab, the
      # startup grab and the server. See mem_limit above.
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      # Directory mount: start.sh and make-channels.mjs are read at container
      # start, so a change to either needs a recreate (README → Deploy).
      - ./bin:/hl:ro
      - ${EPG_STATE_DIR:-/var/lib/homelab/epg}:/epg/public
    networks:
      - proxy

# Joins proxy_proxy, where Jellyfin already is, rather than giving this stack a
# network for others to join: same reasoning as docker/jellyfin/.
networks:
  proxy:
    external: true
    name: proxy_proxy
