<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Work">
  <!-- A checklist: three rows, the top one ticked. The Work page lists open
       issues across the fleet repos, so a list with one item done is its whole
       job. Inked in the design system's identity amber (the `mark` token) in
       its one permitted use, inking a graphic, with a prefers-color-scheme
       step and NO GROUND, like the homelab mark (docker/dashboard/icons/
       favicon.svg) and review.svg. A copy lives at docker/dashboard/icons/
       work.svg for the dashboard tile; keep the two identical. -->
  <style>
    .m { fill: #b4741f; stroke: #b4741f; }
    @media (prefers-color-scheme: dark) { .m { fill: #e0a44f; stroke: #e0a44f; } }
  </style>
  <path class="m" d="M4 8.2 6.6 10.8 11 5.6" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="m" x="14" y="6.8" width="14" height="2.8" rx="1.4" stroke="none"/>
  <rect class="m" x="4.6" y="14.6" width="5" height="5" rx="1" fill="none" stroke-width="2"/>
  <rect class="m" x="14" y="15.6" width="14" height="2.8" rx="1.4" stroke="none"/>
  <rect class="m" x="4.6" y="23.4" width="5" height="5" rx="1" fill="none" stroke-width="2"/>
  <rect class="m" x="14" y="24.4" width="14" height="2.8" rx="1.4" stroke="none"/>
</svg>
