services:
  # The landing page for everything else. Lives at home.<domain>, which is the
  # parent of every service name — so it is the one URL that does not have to be
  # remembered, and every other name is discoverable from it.
  #
  # Config is bind-mounted from the repo rather than held in a volume: the tile
  # list is exactly the sort of thing that rots when it lives only on the box,
  # and CI checks it against the Caddyfile (see .github/workflows/ci.yml).
  dashboard:
    image: ghcr.io/gethomepage/homepage:v1.5.0
    container_name: dashboard
    restart: unless-stopped
    environment:
      # Homepage refuses requests whose Host header it does not recognise —
      # without this you get "Invalid Host header" rather than a page, which
      # looks exactly like a Caddy problem and is not.
      # Exactly $HOMELAB_DOMAIN, with no prefix: the Caddyfile serves the
      # dashboard at the BARE domain, so that is the Host header it receives.
      # Prefixing it here (home.$HOMELAB_DOMAIN -> home.home.brignano.io) is a
      # silent mismatch that renders as "Invalid Host header" and reads exactly
      # like a proxy fault. check-dashboard.sh now compares the two.
      HOMEPAGE_ALLOWED_HOSTS: ${HOMELAB_DOMAIN:?required}
      # Referenced in the YAML as {{HOMEPAGE_VAR_DOMAIN}} so the committed config
      # carries no domain of its own. Only vars with this prefix are substituted.
      HOMEPAGE_VAR_DOMAIN: ${HOMELAB_DOMAIN:?required}
      # Healthchecks project id, used to deep-link the bookmark straight at the
      # check list. Not required — unset just leaves the placeholder visible in
      # the link rather than breaking the stack. It lives here rather than in
      # the committed YAML because this repo is public and the id is scoped to
      # the account, same reasoning as the domain.
      HOMEPAGE_VAR_HC_PROJECT: ${HEALTHCHECKS_PROJECT_ID:-}
    volumes:
      # Writable, and it took two failures to accept that.
      #
      # `:ro` was the obvious choice — the config is the codified part, it comes
      # from the repo, and CI checks it. But Homepage writes its log file to
      # config/logs, so a read-only mount fails the mkdir on every render and
      # every page 500s with the config perfectly valid.
      #
      # The next attempt nested a named volume at /app/config/logs to keep the
      # config itself read-only. That cannot work either: runc has to *create*
      # the mountpoint inside the bind before mounting over it, and the bind is
      # read-only, so the container refuses to start at all.
      #
      # A pre-created logs/ directory in the repo would satisfy runc, but this is
      # not worth a third guess at container behaviour. `:ro` here was defensive
      # polish, not a boundary: Homepage never writes its own config, the
      # container has no Docker socket and sits on one network, and CI is what
      # actually keeps this directory honest. logs/ is gitignored.
      - ./config:/app/config
    networks:
      # Only the proxy network. Deliberately NOT joined to core/monitoring/ai:
      # the tiles are plain links, and the up/down checks go through Caddy over
      # the same URLs a browser uses, so there is nothing to reach directly.
      #
      # No Docker socket either. Homepage can auto-discover services from
      # container labels, but that needs the socket — root-equivalent on this
      # host — to save maintaining a list that CI already keeps honest.
      - proxy

networks:
  proxy:
    external: true
    name: proxy_proxy
