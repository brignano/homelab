# Homepage settings. See https://gethomepage.dev/configs/settings/

title: homelab
description: Every service on the box, in one place.

# Sections render in this order regardless of where they appear in
# services.yaml, so the file can stay grouped by meaning rather than by layout.
layout:
  Web:
    style: row
    columns: 2
  Monitoring:
    style: row
    columns: 3
  AI:
    style: row
    columns: 2
  Network:
    style: row
    columns: 2
  Desktops:
    style: row
    columns: 2

# Appearance. These are the only knobs Homepage gives you — it is a
# config-driven dashboard, not a design surface, so it will look tidy rather
# than bespoke. boxedWidgets + cardBlur is the least default-looking
# combination available without a background image.
headerStyle: boxedWidgets
statusStyle: dot
cardBlur: sm
theme: dark
color: zinc
hideVersion: true
disableCollapse: false

# The clock is genuinely useful here: every timestamp in the digest, the alerts
# and the logs is in this timezone, and the dashboard is where you cross-check.
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
