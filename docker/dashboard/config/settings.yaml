# Homepage settings. See https://gethomepage.dev/configs/settings/

title: homelab
description: Every service on the box, in one place.

# The tab icon, and the icon iOS uses when the dashboard is added to the home
# screen: Homepage points both `rel="icon"` and `rel="apple-touch-icon"` at
# this one path. It has to be the PNG, not the SVG beside it — iOS ignores an
# SVG apple-touch-icon and substitutes a screenshot of the page, which is the
# same unidentifiable tab this replaces. Served out of docker/dashboard/icons,
# which the compose file mounts at /app/public/icons.
favicon: /icons/homelab.png

# Sections render in this order regardless of where they appear in
# services.yaml, so the file can stay grouped by meaning rather than by layout.
layout:
  Web:
    style: row
    columns: 2
  Monitoring:
    style: row
    columns: 3
  AI:
    style: row
    columns: 2
  Network:
    style: row
    columns: 2
  Desktops:
    style: row
    columns: 2

# Appearance. These are the knobs Homepage gives you; the look itself comes
# from config/custom.css, which imports the shared design system.
#
# `color:` no longer decides anything visible. It still matters: it is what
# puts a `theme-<colour>` class on <html>, and the generated palette keys its
# overrides off that class. Changing it is harmless, removing the setting is
# too (Homepage falls back to `slate`, still a `theme-` class), but the class
# has to exist.
#
# `theme: dark` is the default the dashboard opens in. custom.js mirrors
# whichever theme Homepage lands on onto <html data-theme>, so the tokens
# follow the page rather than the phone's OS setting.
headerStyle: boxedWidgets
statusStyle: dot
cardBlur: sm
theme: dark
color: zinc
hideVersion: true
disableCollapse: false

# The clock is genuinely useful here: every timestamp in the digest, the alerts
# and the logs is in this timezone, and the dashboard is where you cross-check.
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
