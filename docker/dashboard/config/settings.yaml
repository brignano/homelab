# Homepage settings. See https://gethomepage.dev/configs/settings/

title: homelab
description: Every service on the box, in one place.

# The tab icon: the mark itself, with a transparent ground and a
# prefers-color-scheme step, which is what the design system's icon standard
# asks for (see docker/dashboard/icons/README.md, and `life`, which learned it
# first). A filled tile disappears against a tab strip that happens to match
# it; an open amber figure carries on both.
#
# Homepage points `rel="icon"` AND `rel="apple-touch-icon"` at this one path,
# and iOS will not take an SVG for the latter. config/custom.js repairs that
# link and declares the raster fallbacks; docker/proxy/Caddyfile serves the
# root paths Safari probes without reading any markup. All of them are in
# docker/dashboard/icons, mounted at /app/public/icons by the compose file.
favicon: /icons/favicon.svg

# Sections render in this order regardless of where they appear in
# services.yaml, so the file can stay grouped by meaning rather than by layout.
# A section missing from this list is not an error to Homepage — it is appended
# after the listed ones, which is how Home Assistant, the tile most often
# reached for, ended up last. scripts/check-dashboard.sh now fails on that.
#
# Everyday is a full-width row of the three things this page is opened for.
# Media and Lab have no `style:`, which makes them columns: Homepage sets
# column sections side by side (two up on a laptop, stacked on a phone) and
# grows them to fill the width. Every section used to be `style: row`, which
# is always full width whatever its `columns:` says — so a one-tile section
# drew one tile and a band of empty card, seven times down the page.
layout:
  Everyday:
    style: row
    columns: 3
  Media:
  Lab:

# Appearance. These are the knobs Homepage gives you; the look itself comes
# from config/custom.css, which imports the shared design system.
#
# `color:` no longer decides anything visible. It still matters: it is what
# puts a `theme-<colour>` class on <html>, and the generated palette keys its
# overrides off that class. Changing it is harmless, removing the setting is
# too (Homepage falls back to `slate`, still a `theme-` class), but the class
# has to exist.
#
# `theme: dark` is the default the dashboard opens in. custom.css sets
# `color-scheme` from whichever theme Homepage lands on, and custom.js mirrors
# it onto <html data-theme>, so the tokens follow the page rather than the
# phone's OS setting.
headerStyle: boxedWidgets
statusStyle: dot
cardBlur: sm
theme: dark
color: zinc
hideVersion: true
disableCollapse: false

# The clock is genuinely useful here: every timestamp in the digest, the alerts
# and the logs is in this timezone, and the dashboard is where you cross-check.
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
