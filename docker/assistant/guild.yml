# Desired state for the homelab Discord server.
#
# Apply with:
#   docker compose -f docker/assistant/docker-compose.yml run --rm --build \
#     assistant --provision          # plan only; add --apply to execute
#
# Idempotent and additive: it creates what's missing and fixes drift, but NEVER
# deletes a channel — deleting one destroys its history, and #digest *is* the
# history. Channels found here but absent below are reported, not removed.
#
# The layout splits on direction, which is the distinction that actually
# matters day to day:
#
#   HOMELAB    the lab reporting to you   — you scroll these, you don't type
#   ASSISTANT  you talking to the model   — conversation, nothing to scroll back for
#
# What this file can't cover, because a bot token isn't allowed to do it:
# creating the server, and restricting which channels a slash command appears
# in. Both are one-time clicks; see docker/assistant/README.md.

# Per-server nickname for the bot. This is deliberately the nickname and not the
# global username: the username lives in the Developer Portal and Discord rate
# limits changes to it (2 per hour), whereas a nickname is server-scoped, free
# to change, and overrides the username everywhere in this server. Declaring it
# here means the name is reproducible along with everything else, and a
# re-provision puts it back if it ever drifts.
bot:
  nickname: Otto

categories:
  # ── Output: things the lab tells you, unprompted ────────────────────────
  - name: HOMELAB
    channels:
      # Locked so it stays a clean, scrollable log. "Was disk climbing last
      # week?" is a question you will actually scroll back for, and interleaved
      # chat would destroy that.
      - name: digest
        topic: >-
          Daily health digest, posted automatically each morning — services up,
          CPU/RAM/disk, container restarts, log-error counts. Bot posts only, so
          it stays a clean timeline you can scroll back through to spot drift
          that no single alert would ever fire on. Ask questions in #ask.
        bot_only: true

      # Fed by webhooks, never by the bot — that's the point. See
      # docs/design/tsd-alerting-off-box.md.
      - name: alerts
        topic: >-
          Alerts from Grafana, plus the dead-man's-switch that fires when the box
          stops pinging Healthchecks. Both arrive by webhook rather than through
          the bot, so they still reach you when the assistant — or the whole
          machine — is down. Silence here is good news.
        bot_only: true

  # ── Input: things you ask it ────────────────────────────────────────────
  - name: ASSISTANT
    channels:
      # #chat (conversational, local model) was removed on 2026-10-12: #ask
      # covers it. The feature is still in the bot, off while
      # DISCORD_CHAT_CHANNEL_ID is blank. To bring it back, restore the block
      # from git history here, provision, and set that ID.

      # The act lane: Claude, with read access to calendar, mail and the house.
      # Routed to docker/concierge/, never to Ollama.
      # See docs/design/tsd-personal-assistant.md, phase 3.
      - name: ask
        topic: >-
          Ask Claude about your calendar, email, home or movies — it looks
          things up before answering. It can propose a calendar event, a Gmail
          draft, a scene or a movie/show download; nothing happens until you
          press ✅. REPLY to a message to continue that conversation, or start a
          THREAD for a longer one; a plain message is a one-off with no history.
          Costs a few cents per question.
        bot_only: false

      # One message per remembered fact, read by the concierge before every
      # #ask task. Bot-only so nothing lands here unapproved — the bot posts a
      # fact when you press Approve. As server owner you can still post one by
      # hand or delete one; editing means delete and re-post.
      - name: memory
        topic: >-
          What #ask remembers about you, one fact per message, read before every
          question. Added only when you approve one. Delete a message to make it
          forget that fact.
        bot_only: true
