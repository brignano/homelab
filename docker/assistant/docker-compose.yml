services:
  # Discord-fronted job runner for the local model. See
  # docs/design/tsd-local-llm-discord-jobs.md for why this exists.
  #
  # Note there are no `ports:` here and no Caddy route. The bot opens an
  # OUTBOUND websocket to Discord, so it adds zero inbound attack surface — and
  # unlike chat.home it keeps working when you're off the tailnet.
  assistant:
    build: .
    image: homelab-assistant:latest
    container_name: assistant
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?required}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?required}
      # NOT `:?required`, deliberately. Compose interpolates before the
      # container starts, so requiring this here would block `--provision` —
      # the command whose whole job is to create the channel and hand you this
      # ID. The bot itself still refuses to start without it (config.py), which
      # is where the guarantee belongs. Empty is fine until provisioning runs.
      DISCORD_DIGEST_CHANNEL_ID: ${DISCORD_DIGEST_CHANNEL_ID:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:?required}

      # Internal DNS names on the joined networks — no host ports involved.
      OLLAMA_URL: http://ollama:11434
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}

      # The one URL here that is NOT an internal name, because it is the only
      # one that gets clicked: the digest footer links to Grafana, and those
      # links are read on a phone. `http://grafana:3000` resolves on this
      # Docker network and nowhere else, so it must be the public name —
      # the same `https://stats.$HOMELAB_DOMAIN` that GF_SERVER_ROOT_URL uses
      # over in docker/monitoring, and for the same reasons (see the comment
      # there: `.home` resolves only through AdGuard, so it dead-ends on
      # cellular). Blank is fine and supported — the digest simply renders
      # without links rather than with broken ones.
      GRAFANA_URL: ${GRAFANA_URL:-}

      # Optional: enables conversational mode in one channel. Blank = off.
      DISCORD_CHAT_CHANNEL_ID: ${DISCORD_CHAT_CHANNEL_ID:-}
      CHAT_HISTORY_TURNS: ${CHAT_HISTORY_TURNS:-12}
      CHAT_HISTORY_CHARS: ${CHAT_HISTORY_CHARS:-4000}
      CHAT_NUM_PREDICT: ${CHAT_NUM_PREDICT:-350}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.6}
      CHAT_LIVE_METRICS: ${CHAT_LIVE_METRICS:-true}
      CHAT_METRICS_TTL_S: ${CHAT_METRICS_TTL_S:-60}

      TZ: ${TZ:-UTC}
      DIGEST_AT: ${DIGEST_AT:-07:30}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-true}

      # Dead man's switch for the scheduled digest. `tasks.loop(time=...)` has
      # no catch-up: a bot that was down at DIGEST_AT and back five minutes
      # later skips that day silently, and a missing digest looks exactly like
      # a quiet morning. The scheduled run pings this; Healthchecks alerts
      # #alerts when it stops. Blank = no switch, reported by `/status` and at
      # startup rather than assumed. NOT `:?required` — an unarmed switch must
      # not stop the digest itself from posting.
      HEALTHCHECKS_DIGEST_URL: ${HEALTHCHECKS_DIGEST_URL:-}

      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      # How long Ollama keeps the model resident after a request. Its own
      # default is 5m, which makes the first message after any pause pay a
      # cold load. "0" unloads immediately, "-1" never unloads.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      ASK_NUM_PREDICT: ${ASK_NUM_PREDICT:-400}
      SUMMARIZE_NUM_PREDICT: ${SUMMARIZE_NUM_PREDICT:-300}
      DIGEST_NUM_PREDICT: ${DIGEST_NUM_PREDICT:-180}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-6000}
      MAX_QUEUE: ${MAX_QUEUE:-8}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - ai
      - monitoring

# Joins the ai stack (ollama) and the monitoring stack (prometheus, loki).
# Bring both of those up first — Compose will not create external networks.
networks:
  ai:
    external: true
    name: ai_ai
  monitoring:
    external: true
    name: monitoring_monitoring
