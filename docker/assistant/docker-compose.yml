services:
  # Otto: the daily digest and a weekly import reminder, over Discord. No
  # model of any kind since 2026-11 (#406, #366), so it costs nothing to run.
  #
  # Note there are no `ports:` here and no Caddy route. The bot opens an
  # OUTBOUND websocket to Discord, so it adds zero inbound attack surface — and
  # it keeps working when you're off the tailnet.
  assistant:
    build: .
    image: homelab-assistant:latest
    container_name: assistant
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?required}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?required}
      # NOT `:?required`, deliberately. Compose interpolates before the
      # container starts, so requiring this here would block `--provision` —
      # the command whose whole job is to create the channel and hand you this
      # ID. The bot itself still refuses to start without it (config.py), which
      # is where the guarantee belongs. Empty is fine until provisioning runs.
      DISCORD_DIGEST_CHANNEL_ID: ${DISCORD_DIGEST_CHANNEL_ID:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:?required}

      # Internal DNS names on the joined networks — no host ports involved.
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100

      # The one URL here that is NOT an internal name, because it is the only
      # one that gets clicked: the digest footer links to Grafana, and those
      # links are read on a phone. `http://grafana:3000` resolves on this
      # Docker network and nowhere else, so it must be the public name —
      # the same `https://stats.$HOMELAB_DOMAIN` that GF_SERVER_ROOT_URL uses
      # over in docker/monitoring, and for the same reasons (see the comment
      # there: `.home` resolves only through AdGuard, so it dead-ends on
      # cellular). Blank is fine and supported — the digest simply renders
      # without links rather than with broken ones.
      GRAFANA_URL: ${GRAFANA_URL:-}

      # Optional: the digest's "Today" section — calendar and new mail, read-only.
      # All three blank = off, and the digest renders exactly as before. The
      # refresh token comes from `--google-auth` (README → "Today: calendar and
      # mail"). Scopes are calendar.events.readonly and gmail.metadata, which
      # Google enforces: this container can never read an email body.
      # See docs/design/tsd-personal-assistant.md, phase 1.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_SOURCES: ${GOOGLE_SOURCES:-calendar,mail}
      GOOGLE_CALENDAR_IDS: ${GOOGLE_CALENDAR_IDS:-primary}
      GMAIL_LABELS: ${GMAIL_LABELS:-INBOX,UNREAD,CATEGORY_PERSONAL}

      # Optional: the "Home" line in Today — Home Assistant states for the
      # entities you list. Both blank = off. The token is a dedicated non-admin
      # HA user's long-lived token; HA cannot make a token read-only, so the
      # read-only promise is in app/home.py (GET only, these entities only).
      # See docker/homeassistant/README.md. HA runs on host networking, so it
      # is reached through the host (extra_hosts below), not by container name.
      HA_URL: ${HA_URL:-http://host.docker.internal:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_ENTITIES: ${HA_ENTITIES:-}
      HA_CALENDARS: ${HA_CALENDARS:-}
      HA_FREE_CALENDARS: ${HA_FREE_CALENDARS:-}

      # Weekly nudge in #digest to download bank statements and import them into
      # Actual Budget. A fixed message, no Claude spend. Day: 0=Mon .. 6=Sun.
      IMPORT_REMINDER_ENABLED: ${IMPORT_REMINDER_ENABLED:-true}
      IMPORT_REMINDER_DAY: ${IMPORT_REMINDER_DAY:-6}
      IMPORT_REMINDER_AT: ${IMPORT_REMINDER_AT:-10:00}

      TZ: ${TZ:-UTC}
      DIGEST_AT: ${DIGEST_AT:-07:30}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-true}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Where the bot records that a scheduled digest posted, for
      # scripts/heartbeat.sh to publish as homelab_digest_timestamp_seconds.
      # `tasks.loop(time=...)` has no catch-up, so a bot down at DIGEST_AT and
      # back five minutes later skips that day in silence — this is what makes
      # that visible, via hl-digest-missing.
      #
      # A host path rather than the container's /tmp, for two reasons: it
      # survives `up -d --build`, and heartbeat.sh can read it while this
      # container is STOPPED, which is exactly when the alert should still fire.
      # A directory mount, so it has none of the single-file inode problem.
      #
      # Created (and chowned to this container's uid 10001) by
      # scripts/install-cron.sh, alongside the node-exporter textfile dir.
      - ${DIGEST_STATE_DIR:-/var/lib/homelab/assistant}:/state
    # Home Assistant runs on host networking: this name resolves to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

# Joins the monitoring stack (prometheus, loki). Bring it up first — Compose
# will not create external networks.
networks:
  monitoring:
    external: true
    name: monitoring_monitoring
