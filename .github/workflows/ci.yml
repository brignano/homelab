# Validate everything that can be validated without the homelab.
#
# Why this exists
# ---------------
# Nothing used to check a commit before it reached main, which mattered more
# than it sounds: this repo deploys to a box that serves the household's DNS, so
# a broken compose file or Caddyfile is a network outage, not a failed build.
# Every check below is one that has actually caught something by hand —
# a Caddyfile that parsed nowhere, a config knob wired into compose but never
# read, an Ollama option that silently undid a performance fix.
#
# None of it needs secrets or network access to the lab: the compose files are
# validated with throwaway values, and the Caddyfile is checked inside the real
# proxy image so the plugin-provided directives actually resolve.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  assistant:
    name: assistant (tests + imports)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the Dockerfile — a version skew here would test something the
          # container never runs.
          python-version: "3.12"

      - name: Install pinned dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Offline smoke tests
        # Pure and offline: no Discord, no Ollama, no Prometheus. Asserts the
        # invariants that have broken before — see tests/smoke.py.
        run: python tests/smoke.py

      - name: Every module compiles
        run: python -m compileall -q app tests

  compose:
    name: compose files parse
    runs-on: ubuntu-latest
    # Throwaway values for the vars each stack declares with `:?required`.
    # Compose interpolates before it validates, so without these the check
    # cannot run at all. None of these are real, and none need to be.
    env:
      WEBUI_SECRET_KEY: ci
      DISCORD_TOKEN: ci
      DISCORD_GUILD_ID: "1"
      DISCORD_ALLOWED_USER_IDS: "1"
      POSTGRES_PASSWORD: ci
      DESKTOP_USER: ci
      DESKTOP_PASSWORD: ci
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ci
      GRAFANA_ADMIN_PASSWORD: ci
      PVE_USER: ci
      PVE_TOKEN_NAME: ci
      PVE_TOKEN_VALUE: ci
      POSTGRES_EXPORTER_DSN: ci
      DISCORD_ALERT_WEBHOOK: https://discord.invalid/api/webhooks/ci
      HOMELAB_DOMAIN: example.com
      CLOUDFLARE_API_TOKEN: ci
      CLOUDFLARE_TUNNEL_TOKEN: ci
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        # Catches malformed YAML, unknown keys, bad port/volume syntax, and any
        # NEW `:?required` var that was added without being listed above — which
        # is the failure worth having: it means someone must decide whether that
        # var belongs in .env.example too.
        run: |
          status=0
          for f in docker/*/docker-compose.yml; do
            if docker compose -f "$f" config -q; then
              echo "ok    $f"
            else
              echo "FAIL  $f"
              status=1
            fi
          done
          exit $status

  scripts:
    name: scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sh -n
        # Syntax only, deliberately. These run from cron where a parse error is
        # silent until the day you need the script to work.
        run: |
          status=0
          for f in scripts/*.sh; do
            if sh -n "$f"; then echo "ok    $f"; else echo "FAIL  $f"; status=1; fi
          done
          exit $status

      - name: python helpers compile
        # Two scripts reach for python where sh would be unreadable — the token
        # palette and the composed icons. Same reasoning as above: a parse error
        # in either is silent until someone runs an update.
        run: python3 -m compileall -q scripts

  observability:
    name: dashboards render and metrics line up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Alerting and scrape config is valid YAML
        run: |
          python3 -c "
          import yaml, pathlib
          for f in ['docker/monitoring/prometheus/prometheus.yml',
                    'docker/monitoring/blackbox/blackbox.yml']:
              yaml.safe_load(pathlib.Path(f).read_text()); print('ok   ', f)
          for f in sorted(pathlib.Path('docker/monitoring/grafana/provisioning').rglob('*.yml')):
              yaml.safe_load(f.read_text()); print('ok   ', f)
          "

      - name: Dashboards render, metrics have a writer, job lists agree
        # Three silent failures, all of which had already happened:
        #
        #   A dashboard full of Angular panels that Grafana 12 no longer ships.
        #   It does not error — it renders blank, which reads like a quiet lab.
        #   Three of the seven dashboards here were in that state.
        #
        #   A homelab_* metric a panel or an alert asks for that no script
        #   writes. The panel is empty, which also reads like a quiet lab.
        #
        #   heartbeat.sh and install-cron.sh drifting on which jobs exist — the
        #   same two-lists-of-one-thing shape as check-dashboard.sh and
        #   check-probes.sh, over the very list whose gap cost three weeks.
        run: ./scripts/check-observability.sh

  dashboard:
    name: dashboard covers every proxied site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Config files are valid YAML
        run: |
          python3 -c "
          import sys, yaml, pathlib
          for f in sorted(pathlib.Path('docker/dashboard/config').glob('*.yaml')):
              yaml.safe_load(f.read_text())
              print('ok   ', f)
          "

      - name: The generated palette still matches the vendored design tokens
        # homepage-palette.css is generated from design-tokens.css, because
        # Homepage themes itself from RGB channels and the design system ships
        # hex. A hand edit to the generated file is the one way the dashboard
        # can drift from the package without anyone noticing, so this
        # regenerates it and diffs. Offline — nothing is fetched.
        run: ./scripts/update-design-tokens.sh --check

      - name: Every Caddyfile site has a tile
        # The Caddyfile and services.yaml are two hand-maintained lists of the
        # same thing. A dashboard that falls behind does not break — it just
        # stops being complete, which is worse, because you keep trusting it.
        run: ./scripts/check-dashboard.sh

  caddy:
    name: Caddyfile adapts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Blackbox probes hit a path Caddy answers 200
        # Text-only, so it runs before the image build and fails in seconds.
        #
        # Caddy routes by Host header and blackbox probes it by container name,
        # which matches no service site. A probe of `http://caddy/` therefore
        # got a 404 and Grafana paged Discord about a healthy proxy, day after
        # day. The probe target and the block that answers it live in different
        # files; this keeps them in step. See scripts/check-probes.sh.
        run: ./scripts/check-probes.sh

      - name: Build the proxy image
        # The real image, not stock Caddy. The Caddyfile uses directives that
        # only exist once the sablier and cloudflare plugins are compiled in —
        # stock Caddy rejects `acme_dns cloudflare` with "module not registered",
        # so validating against it would prove nothing about what we deploy.
        run: docker build -t homelab-caddy docker/proxy

      - name: caddy adapt
        # `adapt`, not `validate`, and the distinction is the whole point.
        #
        # `validate` goes on to *provision* every module, and the cloudflare DNS
        # provider checks its API token's format while doing so — so a real
        # validate needs a credential-shaped secret to say anything at all. That
        # would mean either putting a Cloudflare token in CI, or feeding it a
        # fake and testing the fake. Neither proves the config is good.
        #
        # `adapt` stops at converting the Caddyfile to JSON, which is exactly the
        # boundary worth guarding here: it still catches syntax errors and any
        # directive the compiled-in plugins do not provide (stock Caddy dies on
        # `acme_dns cloudflare` right here), without needing a single secret.
        #
        # Both env vars must be set, for different reasons, and dropping either
        # fails the run:
        #
        #   HOMELAB_DOMAIN     the adapter substitutes it into every site address.
        #                      Unset, the blocks become `stats.`, `chat.` and so
        #                      on — a config we never deploy.
        #   CLOUDFLARE_API_TOKEN  `acme_dns cloudflare {$CLOUDFLARE_API_TOKEN}`
        #                      expands to nothing and the directive is rejected
        #                      at adapt time with "missing API token". The value
        #                      only has to be non-empty: the check that cares
        #                      what a token *looks like* runs during provisioning,
        #                      which `adapt` never reaches.
        #
        # The Caddyfile is bind-mounted at runtime rather than baked into the
        # image, so it is mounted here the same way.
        run: |
          docker run --rm \
            -e HOMELAB_DOMAIN=example.com \
            -e CLOUDFLARE_API_TOKEN=ci \
            -v "$PWD/docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            homelab-caddy caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null

  renovate:
    name: renovate config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: renovate-config-validator
        # A broken renovate.json5 does not fail loudly — Renovate simply stops
        # opening PRs, which looks exactly like "nothing needed updating". That
        # is the same silence this repo has now been bitten by three times, and
        # here it would rot the one stack deliberately excluded from automatic
        # pulls, so the config is checked rather than trusted.
        #
        # This has already earned its place: the first draft of renovate.json5
        # used `"a" + "b"` to wrap a long description, which JSON5 does not
        # support. The file looked fine and parsed nowhere.
        #
        # Installed rather than run through `npx --package`, which resolves to a
        # broken dependency tree for this package. No arguments: the validator
        # discovers renovate.json5 itself and checks it as a REPOSITORY config,
        # whereas passing the path makes it validate as a global config and
        # apply the wrong schema.
        run: |
          npm install --no-save --no-audit --no-fund renovate
          ./node_modules/.bin/renovate-config-validator
