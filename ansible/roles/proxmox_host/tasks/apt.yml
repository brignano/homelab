# Proxmox VE 9 (Debian trixie) uses deb822 .sources files. A fresh install
# ships the enterprise repos enabled, and without a subscription every
# `apt update` fails on them.

- name: Find enterprise sources
  ansible.builtin.stat:
    path: "/etc/apt/sources.list.d/{{ item }}"
  loop: [pve-enterprise.sources, ceph.sources]
  register: hl_enterprise_sources

- name: Disable enterprise sources
  # After the Types: line, not at the end of the file: a line after a
  # trailing blank line would start a second, invalid stanza.
  ansible.builtin.lineinfile:
    path: "{{ item.stat.path }}"
    regexp: '^Enabled:'
    line: 'Enabled: false'
    insertafter: '^Types:'
  loop: "{{ hl_enterprise_sources.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Is a no-subscription source configured anywhere?
  # The GUI writes it to a file of its own choosing. Adding a second copy would
  # make every apt run warn about a source "configured multiple times".
  ansible.builtin.command: grep -rlq pve-no-subscription /etc/apt/sources.list.d /etc/apt/sources.list
  register: hl_nosub
  changed_when: false
  failed_when: false
  check_mode: false

- name: Add the no-subscription source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
  when: hl_nosub.rc != 0
