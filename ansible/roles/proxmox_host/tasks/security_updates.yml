# Debian security updates install on their own, so a CVE in a host package is
# not a message to me with commands in it. Tailscale is already covered by its
# own --auto-update (tailscale.yml).
#
# Security origin only: Proxmox's own packages (kernel, qemu, pve-*) and
# Debian point releases stay manual, because a half-applied PVE upgrade on the
# box that runs the whole house is worse than a week-old one. No automatic
# reboot either: a kernel or libc fix waits for a reboot I choose.

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Only the Debian security origin, never reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    mode: "0644"
    content: |
      // Managed by ansible/roles/proxmox_host/tasks/security_updates.yml
      Unattended-Upgrade::Origins-Pattern {
              "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "false";

- name: Run it daily
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
