- name: Restart node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload systemd
  # Picks up crypttab and fstab edits. Mounting is left to the next boot or
  # to you: mounting a drive mid-run is not something to do unasked.
  ansible.builtin.systemd_service:
    daemon_reload: true
