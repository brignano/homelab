- name: Reload sysctl
  # This one file only. `sysctl --system` would re-apply every file under
  # /etc/sysctl.d, and inside an LXC some of those keys belong to the host.
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-ipv6.conf
  changed_when: true

- name: Generate locales
  ansible.builtin.command: locale-gen
  changed_when: true
